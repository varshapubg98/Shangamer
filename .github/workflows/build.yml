name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Official Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Extract Zip
        run: |
          for f in *.zip; do
            [ -f "$f" ] && unzip -o "$f"
          done

      - name: Auto-Generate Missing Resources and Increase RAM
        run: |
          DIR=$(dirname "$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)")
          cd "$DIR"

          # 1. Missing res folder banayein
          mkdir -p app/src/main/res/values
          
          # 2. strings.xml banayein
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Shangamer</string>
          </resources>
          EOF

          # 3. Theme banayein
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.Shangamer" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          # 4. Android Manifest me missing icons theek karein
          sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@android:drawable/sym_def_app_icon"|g' app/src/main/AndroidManifest.xml
          sed -i 's|android:roundIcon="@mipmap/ic_launcher_round"||g' app/src/main/AndroidManifest.xml

          # 5. Missing proguard banayein
          touch app/proguard-rules.pro

          # 6. Memory 4GB badhayein taaki OutOfMemory na aaye
          touch gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Compile APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m'"
          _JAVA_OPTIONS: "-Xmx4096m"
        run: |
          DIR=$(dirname "$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)")
          cd "$DIR"
          gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK Download
        uses: actions/upload-artifact@v4
        with:
          name: Shangamer-APK
          path: '**/*.apk'
