name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Official Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Extract Zip
        run: |
          for f in *.zip; do
            [ -f "$f" ] && unzip -o "$f"
          done

      - name: Compile APK
        run: |
          DIR=$(dirname "$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)")
          cd "$DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK Download
        uses: actions/upload-artifact@v4
        with:
          name: Shangamer-APK
          path: '**/*.apk'
