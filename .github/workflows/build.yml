name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows one-click "Run workflow" button in Actions tab

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Java (Temurin distribution is recommended & stable)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Step 3: CRITICAL FIX - Grant execute permission to Linux runner
      - name: Grant execute permission for gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          elif [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
          fi

      # Step 4: CRITICAL FIX - Build APK with stacktrace & ignore lint aborts
      - name: Compile APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug -x lint -x test --stacktrace
          elif [ -f "./android/gradlew" ]; then
            cd android && ./gradlew assembleDebug -x lint -x test --stacktrace
          else
            echo "Error: gradlew file not found! Make sure your repository has gradlew."
            exit 1
          fi

      # Step 5: Upload the generated APK so you can download it directly from GitHub
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Shangamer-debug-apk
          path: |
            **/build/outputs/apk/**/*.apk
          retention-days: 14
          
