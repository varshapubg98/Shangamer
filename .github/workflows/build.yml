name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger button from GitHub Actions tab

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # If your project is inside a ZIP file in the repo
      - name: Extract Project ZIP (if present)
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file: $ZIP_FILE. Extracting..."
            unzip -q -o "$ZIP_FILE" -d extracted_project
            echo "PROJECT_DIR=extracted_project" >> $GITHUB_ENV
          else
            echo "No zip file found, using root directory."
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          fi

      # Locate directory containing gradlew or build.gradle
      - name: Detect Android Project Root
        run: |
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            echo "GRADLE_ROOT=$PROJECT_DIR" >> $GITHUB_ENV
          elif [ -f "./gradlew" ]; then
            echo "GRADLE_ROOT=." >> $GITHUB_ENV
          else
            FOUND_DIR=$(find . -name "gradlew" -not -path "*/.*" | head -n 1 | xargs -r dirname)
            if [ -n "$FOUND_DIR" ]; then
              echo "GRADLE_ROOT=$FOUND_DIR" >> $GITHUB_ENV
            else
              echo "GRADLE_ROOT=." >> $GITHUB_ENV
            fi
          fi
          echo "Selected Gradle Root: $GRADLE_ROOT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # NOTE: ubuntu-latest ALREADY HAS Android SDK pre-installed!
      # We simply accept licenses without downloading broken external actions:
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: |
          cd "$GRADLE_ROOT"
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            echo "gradlew not found, generating wrapper..."
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build Android APK with Gradle
        run: |
          cd "$GRADLE_ROOT"
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate and Prepare Output APK
        run: |
          mkdir -p output_apks
          find . -name "*.apk" -exec cp {} output_apks/ \;
          ls -la output_apks/

      - name: Upload Built APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shangamer-Android-APK
          path: output_apks/*.apk
          retention-days: 14
          
