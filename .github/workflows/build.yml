name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK from Zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Java 11 is required for UnityAds and Android Gradle plugins
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Unzip Project
        run: |
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Extracting $f"
              unzip -o "$f"
            fi
          done

      - name: Build Android APK
        run: |
          # Find gradlew or build.gradle
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            echo "Found gradlew in $PROJECT_DIR"
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            BUILD_GRADLE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
            PROJECT_DIR=$(dirname "$BUILD_GRADLE")
            echo "Found build.gradle in $PROJECT_DIR"
            cd "$PROJECT_DIR"
            
            # Setup Gradle 7.5.1
            wget -q https://services.gradle.org/distributions/gradle-7.5.1-bin.zip
            unzip -q gradle-7.5.1-bin.zip
            export PATH=$PWD/gradle-7.5.1/bin:$PATH
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: '**/*.apk'
          if-no-files-found: warn
