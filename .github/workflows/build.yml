name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q AiZoid.zip
      - run: sed -i 's/YOUR_UNITY_GAME_ID_HERE/800407541/' AiZoid/app/src/main/java/com/aizoid/unityadsdemo/Constants.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
        working-directory: AiZoid
      - uses: actions/upload-artifact@v4
        with:
          name: AiZoid-apk
          path: AiZoid/app/build/outputs/apk/debug/app-debug.apk
