name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK from Zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Unzip Project
        run: |
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Extracting $f"
              unzip -o "$f"
            fi
          done

      - name: Auto-Fix Deprecated Repositories
        run: |
          # Replace dead jcenter with mavenCentral and google
          find . -name "*.gradle" -o -name "*.gradle.kts" | while read -r file; do
            sed -i 's/jcenter()/mavenCentral()/g' "$file"
          done

      - name: Build Android APK
        run: |
          # Find gradlew or build.gradle
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            cd "$PROJECT_DIR"
            chmod +x gradlew
            BUILD_CMD="./gradlew assembleDebug --no-daemon"
          else
            BUILD_GRADLE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
            PROJECT_DIR=$(dirname "$BUILD_GRADLE")
            cd "$PROJECT_DIR"
            
            wget -q https://services.gradle.org/distributions/gradle-7.5.1-bin.zip
            unzip -q -o gradle-7.5.1-bin.zip
            export PATH=$PWD/gradle-7.5.1/bin:$PATH
            BUILD_CMD="gradle assembleDebug --no-daemon"
          fi

          echo "Running build in: $PROJECT_DIR"
          
          # Run build and capture error if any
          if ! $BUILD_CMD 2>&1 | tee build_output.log; then
            echo "================ ERROR SUMMARY ================"
            grep -A 10 "\* What went wrong:" build_output.log || tail -n 30 build_output.log
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: '**/*.apk'
          if-no-files-found: warn
