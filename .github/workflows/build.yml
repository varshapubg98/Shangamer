name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK from Zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Unzip Project
        run: |
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Extracting $f"
              unzip -o "$f"
            fi
          done

      - name: Auto-Fix Repositories
        run: |
          find . -name "*.gradle" -o -name "*.gradle.kts" | while read -r file; do
            sed -i 's/jcenter()/mavenCentral()/g' "$file"
          done

      - name: Build Android Project
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew assemble --no-daemon
          else
            BUILD_GRADLE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
            PROJECT_DIR=$(dirname "$BUILD_GRADLE")
            cd "$PROJECT_DIR"
            
            wget -q https://services.gradle.org/distributions/gradle-7.5.1-bin.zip
            unzip -q -o gradle-7.5.1-bin.zip
            export PATH=$PWD/gradle-7.5.1/bin:$PATH
            gradle assemble --no-daemon
          fi

          echo "=== SEARCHING ALL GENERATED FILES ==="
          mkdir -p $GITHUB_WORKSPACE/output_files
          find . -type f \( -name "*.apk" -o -name "*.aar" -o -name "*.aab" \) -exec cp {} $GITHUB_WORKSPACE/output_files/ \;
          ls -la $GITHUB_WORKSPACE/output_files/

      - name: Upload Output Files (APK / AAR)
        uses: actions/upload-artifact@v4
        with:
          name: Shangamer-Outputs
          path: output_files/
          if-no-files-found: warn
