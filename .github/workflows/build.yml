name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: रिपॉजिटरी चेकआउट
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: रिपॉजिटरी की फाइल्स देखना (ताकि पता चले कौन सी फाइल्स मौजूद हैं)
      - name: Inspect Files
        run: |
          echo "=== Files in Shangamer ==="
          ls -la

      # Step 3: Java 17 सेट करें (बिना cache के - ताकि कभी क्रैश न हो!)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 4: gradlew को Linux रन परमिशन दें
      - name: Grant execute permission for gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi
          if [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
          fi

      # Step 5: APK कंपाइल करें
      - name: Compile APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug -x lint -x test --stacktrace
          elif [ -f "./android/gradlew" ]; then
            cd android && ./gradlew assembleDebug -x lint -x test --stacktrace
          elif [ -f "./build.gradle" ]; then
            gradle assembleDebug -x lint -x test --stacktrace
          else
            echo "Directory contents:"
            ls -la
            echo "No gradle file found in Shangamer! Check file structure."
            exit 1
          fi

      # Step 6: APK को Artifacts में अपलोड करें (फोन में डाउनलोड करने के लिए)
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Shangamer-debug-apk
          path: |
            **/build/outputs/apk/**/*.apk
          retention-days: 14
