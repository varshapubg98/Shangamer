name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Extract any ZIP file in repo (if present)
      - name: Extract Project ZIP
        run: |
          echo "=== Checking for ZIP files ==="
          ZIP_FILES=$(find . -maxdepth 2 -type f -name "*.zip")
          if [ -n "$ZIP_FILES" ]; then
            for f in $ZIP_FILES; do
              echo "Extracting: $f"
              unzip -o -q "$f"
            done
          else
            echo "No zip files found, using checked out files."
          fi
          echo "Files in workspace:"
          ls -la

      # 2. Setup Java 17 (Temurin)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Accept Android SDK licenses (Pre-installed on runner)
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      # 4. FIX FOR "Grant execute permission for gradlew":
      # Finds gradlew in root OR any extracted subfolder without erroring!
      - name: Grant execute permission for gradlew
        run: |
          echo "Locating gradlew file..."
          # Make all gradlew files executable anywhere in the repo:
          find . -type f -name "gradlew" -exec chmod +x {} + || true
          
          # Find directory containing gradlew
          FOUND_DIR=$(find . -type f -name "gradlew" | head -n 1 | xargs -r dirname)
          if [ -n "$FOUND_DIR" ]; then
            echo "Found gradlew in: $FOUND_DIR"
            echo "PROJECT_ROOT=$FOUND_DIR" >> $GITHUB_ENV
          else
            echo "No gradlew found, searching for build.gradle..."
            BUILD_DIR=$(find . -type f -name "build.gradle*" | head -n 1 | xargs -r dirname)
            if [ -n "$BUILD_DIR" ]; then
              echo "PROJECT_ROOT=$BUILD_DIR" >> $GITHUB_ENV
            else
              echo "PROJECT_ROOT=." >> $GITHUB_ENV
            fi
          fi

      # 5. Build APK using detected project folder
      - name: Build Android APK with Gradle
        run: |
          cd "${PROJECT_ROOT:-.}"
          echo "Working directory: $(pwd)"
          
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            echo "No wrapper found, attempting gradle build..."
            gradle assembleDebug --stacktrace --no-daemon
          fi

      # 6. Collect output APKs
      - name: Prepare APK Output
        run: |
          mkdir -p output_apks
          find . -type f -name "*.apk" -exec cp {} output_apks/ \;
          echo "Collected APKs:"
          ls -lh output_apks/

      # 7. Upload APK artifact for direct download
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shangamer-Debug-APK
          path: output_apks/*.apk
          retention-days: 14
          
